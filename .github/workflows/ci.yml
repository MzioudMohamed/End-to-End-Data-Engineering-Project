name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install pytest

      - name: Vérifier la syntaxe Python
        run: python -m compileall bronze silver gold

      - name: Tester l'orchestrateur
        run: python -m pytest tests/test_orchestration.py -q

      - name: Configurer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Vérifier le format Terraform
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialiser Terraform sans backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Valider Terraform
        working-directory: infra
        run: terraform validate
  
  oidc-smoke-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Connexion Azure avec OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Vérifier l'accès Azure
        shell: pwsh
        run: |
          $accountName = az account show --query name -o tsv

          if ([string]::IsNullOrWhiteSpace($accountName)) {
              throw "La connexion Azure OIDC a échoué."
          }

          Write-Host "Connexion Azure OIDC réussie."