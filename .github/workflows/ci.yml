name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install pytest

      - name: Vérifier la syntaxe Python
        run: python -m compileall bronze silver gold

      - name: Tester l'orchestrateur
        run: python -m pytest tests/test_orchestration.py -q

      - name: Configurer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Vérifier le format Terraform
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialiser Terraform sans backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Valider Terraform
        working-directory: infra
        run: terraform validate